# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > select this repo. Then set LLM_API_KEY (your Featherless key)
# in the service's Environment tab; without it the LLM layer runs in mock mode.
services:
  - type: web
    name: trustgate
    runtime: python
    plan: free
    # Datasets are downloaded and the model is trained at build time (nothing binary in git).
    # If either step fails the app still deploys, with the ML layer reported as "unavailable".
    buildCommand: >-
      pip install -r requirements.txt &&
      (python scripts/download_data.py && python -m trustgate.ml.train ||
      echo "WARNING: dataset download or training failed; ML layer disabled")
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_BASE_URL
        value: https://api.featherless.ai/v1
      - key: LLM_MODEL
        value: Qwen/Qwen2.5-14B-Instruct
      - key: LLM_MODE
        value: auto
      - key: LLM_API_KEY
        sync: false
