[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate"
version = "0.1.0"
description = "Layered scam & impersonation risk verification before money moves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.3",
    "openai>=1.40,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["trustgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
